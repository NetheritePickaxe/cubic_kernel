name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: '构建目标'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - desktop
          - shared

jobs:
  shared-build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'shared' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-shared-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-shared-
      - name: Build shared
        run: ./gradlew :shared:build --no-daemon --no-parallel

  android-build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses --sdk_root=${{ runner.temp }}/android-sdk
      - name: Install Android SDK
        run: sdkmanager --sdk_root=${{ runner.temp }}/android-sdk "platforms;android-35" "build-tools;35.0.0" --no_https
      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --no-parallel
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app-debug.apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
          archive: false

  desktop-build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'desktop' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~\gradle\caches
            ~\gradle\wrapper
          key: ${{ runner.os }}-gradle-desktop-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-desktop-
      - name: Build Desktop
        run: ./gradlew.bat :desktopApp:build --no-daemon --no-parallel
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-app.jar
          path: desktopApp/build/libs/*.jar
          retention-days: 7
          archive: false

  create-release:
    needs: [android-build, desktop-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses --sdk_root=${{ runner.temp }}/android-sdk
      - name: Install Android SDK
        run: sdkmanager --sdk_root=${{ runner.temp }}/android-sdk "platforms;android-35" "build-tools;35.0.0" --no_https
      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --no-parallel
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      - name: Build Desktop
        run: ./gradlew :desktopApp:build --no-daemon --no-parallel
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            androidApp/build/outputs/apk/debug/*.apk
            desktopApp/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
